<svg width="960" height="700" viewBox="0 0 960 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node { cursor: pointer; transition: opacity 160ms ease; }
    .title { font-family: 'IBM Plex Sans', 'PingFang SC', sans-serif; font-size: 34px; font-weight: 700; fill: #3d77c4; }
    .label { font-family: 'IBM Plex Sans', 'PingFang SC', sans-serif; font-size: 18px; fill: #2c3138; }
    .small { font-family: 'IBM Plex Sans', 'PingFang SC', sans-serif; font-size: 13px; fill: #68727f; }
    .shell { fill: #eef2f7; stroke: #4b5d73; stroke-width: 3; }
    .block-blue { fill: #d9e7f7; stroke: #4a7bb7; stroke-width: 2.4; }
    .block-orange { fill: #f8e2c7; stroke: #b87c44; stroke-width: 2.4; }
    .block-green { fill: #dbeedc; stroke: #5c9460; stroke-width: 2.4; }
    .block-slate { fill: #f6f8fb; stroke: #5f6a75; stroke-width: 2.2; }
    .line { stroke: #3a4754; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  </style>

  <text x="84" y="64" class="title">Qwen3 (235B-A22B)</text>

  <g id="node_tokens" data-node-id="tokens" class="node">
    <rect x="286" y="610" width="188" height="48" rx="14" class="block-slate"/>
    <text x="338" y="641" class="label">Tokens</text>
  </g>

  <g id="node_embedding" data-node-id="embedding" class="node">
